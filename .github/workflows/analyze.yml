name: AI Analysis (replaced by cron-analyze Worker)

on:
  # 由 cron-analyze Worker (jianxun-cron-analyze) 替代，每 3h 自动触发
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://jianxun.pages.dev' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analyze unprocessed articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "=== Batch $i ==="
            # Get unanalyzed articles
            ITEMS=$(curl -s "$SITE_URL/api/news?pageSize=20")
            echo "$ITEMS" | node -e "
            // Node 20+ global fetch — no node-fetch / checkout needed
            const DEEPSEEK_API_KEY = process.env.DEEPSEEK_API_KEY;
            const ADMIN_TOKEN = process.env.ADMIN_TOKEN;

            async function main() {
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              const items = data.items || [];
              const pending = items.filter(i => !i.summary || i.summary.endsWith('...'));
              console.log('Pending:', pending.length);

              for (const article of pending.slice(0, 3)) {
                console.log('Analyzing:', article.title.slice(0, 60));
                const content = (article.description || article.title).slice(0, 2000);

                const res = await fetch('https://api.deepseek.com/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + DEEPSEEK_API_KEY,
                  },
                  body: JSON.stringify({
                    model: 'deepseek-v4-flash',
                    messages: [
                      { role: 'system', content: '你是新闻分析助手。输出JSON：{\"summary\":\"2-3句摘要\",\"category\":\"AI|科技|财经|国际|政治|健康|体育|娱乐|游戏|教育|社会\",\"entities\":[{\"name\":\"\",\"type\":\"company|person|product|technology|concept\"}],\"sentiment\":{\"label\":\"positive|negative|neutral|mixed\",\"perspective\":\"\"}}' },
                      { role: 'user', content: '标题：' + article.title + '\n正文：' + content },
                    ],
                    temperature: 0.01,
                    max_tokens: 1024,
                  }),
                });
                const raw = await res.json();
                const text = raw.choices?.[0]?.message?.content || '';
                const cleaned = text.replace(/\x60\x60\x60json\n?/g, '').replace(/\x60\x60\x60\n?/g, '').trim();
                try {
                  const parsed = JSON.parse(cleaned);
                  // API expects entities as string[] and sentiment as positive|neutral|negative
                  const entities = (parsed.entities || []).map(e => typeof e === 'string' ? e : e && e.name).filter(Boolean);
                  const label = typeof parsed.sentiment === 'string' ? parsed.sentiment : parsed.sentiment && parsed.sentiment.label;
                  const sentiment = ['positive', 'neutral', 'negative'].includes(label) ? label : undefined;
                  // POST result back to Worker
                  const save = await fetch('$SITE_URL/api/news/' + article.id + '/detail', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + ADMIN_TOKEN,
                    },
                    body: JSON.stringify({
                      summary: parsed.summary || '',
                      category: parsed.category || '',
                      entities,
                      sentiment,
                    }),
                  });
                  console.log('  ✅ Saved', save.status);
                } catch(e) { console.log('  ❌ Parse error:', e.message); }
              }
            }
            main().catch(e => console.error(e));
            "
          done
