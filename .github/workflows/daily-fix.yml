name: Daily Image Fix

on:
  schedule:
    - cron: '0 6 * * *'  # 每天 6:00 UTC = 14:00 CST
  workflow_dispatch:

jobs:
  fix-images:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://jianxun.pages.dev' }}
    steps:
      - name: Trigger image fix
        run: |
          curl -s --max-time 180 -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "$SITE_URL/api/news/fix-images"
      - name: Translate English articles
        run: |
          curl -s --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "$SITE_URL/api/news/translate"
