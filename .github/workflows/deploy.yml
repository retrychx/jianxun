name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 部署前把关：后端（src+functions+tests）类型检查 + 单元/路由冒烟测试。
      # 曾因 tryCatch 二次序列化把多个端点变成 {} 上线——这里提前拦住。
      - name: Typecheck backend
        run: npx tsc -p apps/api/tsconfig.check.json

      - name: Run tests
        run: npx vitest run -c apps/api/vitest.config.ts

      - name: Build frontend
        run: pnpm build

      # 先迁移再部署：新代码上线时 schema 已就绪，避免短暂报错
      # Pages 不支持 -c 自定义配置路径，需 cd 到 apps/api 再运行
      - name: Run D1 migrations
        run: cd apps/api && npx wrangler d1 migrations apply jianxun --remote

      # 从 apps/api 运行（wrangler.toml + functions/ + pages_build_output_dir 都在其目录下解析）
      - name: Deploy to Cloudflare Pages
        run: cd apps/api && npx wrangler pages deploy --project-name jianxun --branch main

      # printf（而非 echo）避免把末尾换行符写进 secret
      # wrangler.toml 在 apps/api（不在 cwd），secret 命令需显式 --project-name
      - name: Set DeepSeek API Key
        run: printf '%s' "${{ secrets.DEEPSEEK_API_KEY }}" | npx wrangler pages secret put DEEPSEEK_API_KEY --project-name jianxun

      - name: Set Admin Token
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler pages secret put ADMIN_TOKEN --project-name jianxun

      - name: Deploy cron-analyze Worker
        run: npx wrangler deploy -c workers/cron-analyze/wrangler.toml

      # 此前 cron-fetch 从未被 CI 部署，其改动不会上线
      - name: Deploy cron-fetch Worker
        run: npx wrangler deploy -c workers/cron-fetch/wrangler.toml

      - name: Set Admin Token for cron-fetch
        working-directory: workers/cron-fetch
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: Set Admin Token for cron-analyze
        working-directory: workers/cron-analyze
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      # 注：此前这里有个错误的 health-check URL（用账户 ID 当子域名，HTTP 000 一直静默失败）。
      # 真正的健康监控由 .github/workflows/health-check.yml（每小时的抓取/日报新鲜度检查）承担。
