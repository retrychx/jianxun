name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 部署前把关：后端（src+functions+tests）类型检查 + 单元/路由冒烟测试。
      # 曾因 tryCatch 二次序列化把多个端点变成 {} 上线——这里提前拦住。
      - name: Typecheck backend
        run: npx tsc -p tsconfig.check.json

      - name: Run tests
        run: npx vitest run

      - name: Build frontend
        run: pnpm build

      # 先迁移再部署：新代码上线时 schema 已就绪，避免短暂报错
      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply jianxun --remote

      # config 式部署（读取 wrangler.toml pages_build_output_dir），确保 functions/ 一起发布
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --project-name jianxun --branch main

      # printf（而非 echo）避免把末尾换行符写进 secret
      - name: Set DeepSeek API Key
        run: printf '%s' "${{ secrets.DEEPSEEK_API_KEY }}" | npx wrangler pages secret put DEEPSEEK_API_KEY

      - name: Set Admin Token
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler pages secret put ADMIN_TOKEN

      - name: Deploy cron-analyze Worker
        run: npx wrangler deploy -c workers/cron-analyze/wrangler.toml

      # 此前 cron-fetch 从未被 CI 部署，其改动不会上线
      - name: Deploy cron-fetch Worker
        run: npx wrangler deploy -c workers/cron-fetch/wrangler.toml

      - name: Set Admin Token for cron-fetch
        working-directory: workers/cron-fetch
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: Set Admin Token for cron-analyze
        working-directory: workers/cron-analyze
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: Verify cron-analyze health
        continue-on-error: true
        env:
          ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || '863129776' }}
        run: |
          curl -s "https://jianxun-cron-analyze.${ACCOUNT_ID}.workers.dev/health" --max-time 10 || echo "health check skipped (expected if cold start)"
