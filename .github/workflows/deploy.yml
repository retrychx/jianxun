name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy packages/frontend/dist --branch main

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply jianxun --remote

      - name: Set DeepSeek API Key
        run: echo "${{ secrets.DEEPSEEK_API_KEY }}" | npx wrangler pages secret put DEEPSEEK_API_KEY

      - name: Set Admin Token
        run: echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler pages secret put ADMIN_TOKEN
