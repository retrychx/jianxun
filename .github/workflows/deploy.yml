name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy packages/frontend/dist --branch main

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply jianxun --remote

      - name: Set DeepSeek API Key
        run: echo "${{ secrets.DEEPSEEK_API_KEY }}" | npx wrangler pages secret put DEEPSEEK_API_KEY

      - name: Set Admin Token
        run: echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler pages secret put ADMIN_TOKEN

      - name: Deploy cron-analyze Worker
        run: npx wrangler deploy -c workers/cron-analyze/wrangler.toml

      - name: Set Admin Token for cron-analyze
        working-directory: workers/cron-analyze
        run: |
          echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          echo "Admin token set on cron-analyze"

      - name: Verify cron-analyze health
        continue-on-error: true
        env:
          ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || '863129776' }}
        run: |
          curl -s "https://jianxun-cron-analyze.${ACCOUNT_ID}.workers.dev/health" --max-time 10 || echo "health check skipped (expected if cold start)"
