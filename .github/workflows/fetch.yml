name: Fetch RSS

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://jianxun.pages.dev' }}
    steps:
      - name: Trigger RSS fetch
        run: |
          curl -s --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "$SITE_URL/api/news/fetch"
