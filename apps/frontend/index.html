<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0eb" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="简讯 - AI 智能新闻聚合：每日简报、热门排行、话题簇与多来源报道分析" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="简讯" />
    <title>简讯 - AI 智能新闻</title>
    <script>
      (function () {
        var themes = ['light', 'dark', 'retro']
        var stored = localStorage.getItem('theme')
        var theme = themes.indexOf(stored) !== -1 ? stored : 'retro'
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          var colors = { light: '#fafafa', dark: '#111111', retro: '#f5f0eb' }
          meta.setAttribute('content', colors[theme] || '#f5f0eb')
        }
        // PWA安装提示：在 React 加载前捕获 beforeinstallprompt
        window.__pwaPrompt = null
        window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); window.__pwaPrompt = e })
        // Service Worker 注册
        if ('serviceWorker' in navigator) {
          setTimeout(function() {
            navigator.serviceWorker.register('/sw.js').catch(function(){})
          }, 1000)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
