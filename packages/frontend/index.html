<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0eb" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="简讯 - AI 智能新闻聚合：每日简报、热门排行、话题簇与多来源报道分析" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>📰</text></svg>" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="简讯" />
    <title>简讯 - AI 智能新闻</title>
    <script>
      (function () {
        var themes = ['light', 'dark', 'retro']
        var stored = localStorage.getItem('theme')
        var theme = themes.indexOf(stored) !== -1 ? stored : 'retro'
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          var colors = { light: '#fafafa', dark: '#111111', retro: '#f5f0eb' }
          meta.setAttribute('content', colors[theme] || '#f5f0eb')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
